[package]
name = "src-tauri"
version = "0.1.0"
edition = "2021"

[lib]
name = "mac_password_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
tauri-app = ["dep:tauri"]

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
chrono = { version = "0.4.45", features = ["serde", "clock"] }
rand = "=0.8.5"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.0.0", optional = true }
thiserror = "2.0.21"
uuid = { version = "=1.20.0", features = ["v4", "serde"] }
zeroize = "1.8.2"

[dev-dependencies]
tempfile = "=3.10.1"
